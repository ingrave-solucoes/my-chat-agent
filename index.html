<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Assistente Ingrave</title>
    <link rel="icon" href="/ingrave-simbolo.svg" type="image/svg+xml" />
    <script>
      /* Theme before first paint: ?theme=, then the system preference (widget.js sends the site theme later). */
      (function () {
        var param = new URLSearchParams(location.search).get("theme");
        var dark = param ? param === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
